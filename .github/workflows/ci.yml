name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: All packages carry the same version
        run: node scripts/version.mjs
      - name: CDN build helpers
        run: node --test cdn/*.test.mjs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  expo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - run: npm ci
      - name: Vendored native sources match ios/ and android/
        run: npm run sync-native:check
      - run: npm run build
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :kerdly-sdk:testDebugUnitTest :kerdly-sdk:assembleRelease

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests on the newest iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print([x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")][0])')
          xcodebuild test -scheme KerdlySDK -destination "id=$DEVICE" | tail -n 40
          exit ${PIPESTATUS[0]}
      - name: Podspec
        run: pod lib lint KerdlySDK.podspec --allow-warnings
